name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Replace %VERSION% in MainLayout.razor
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          sed -i "s|%VERSION%|$COMMIT_HASH|g" Frontend/Layout/MainLayout.razor

      - name: Build and publish
        run: dotnet publish -c Release -o release

      - name: Update base href for GitHub Pages
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO_NAME/\" />|" release/wwwroot/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/wwwroot
